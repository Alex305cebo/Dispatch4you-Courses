# Здоровье ключа Gemini на боевом сайте.
#
# Раньше этот воркфлоу ещё разворачивал вебсокет-мост на бесплатном Cloudflare
# Worker для живого speech-to-speech. Оказалось: временный аккаунт Cloudflare
# держит воркер за бот-защитой «Just a moment», и cross-origin fetch из браузера
# её решить не может — 403 всем, кроме GitHub-IP. То есть на бесплатном тарифе
# живой мост для студентов недостижим; ему нужен платный аккаунт Cloudflare,
# где Bot Fight Mode выключается. Код моста сохранён в broker-call/worker/ на
# будущее, но здесь не разворачивается.
#
# Что этот воркфлоу делает сейчас и зачем: держит на сервере РАБОЧИЙ ключ
# Gemini. Ключи отзывают (утёкший — за минуты), и когда gemini.key на Hostinger
# мёртв, у сайта отваливаются озвучка, разбор и диалог через Gemini. Воркфлоу
# берёт рабочий ключ из секрета GEMINI_API_KEY_BRIDGE, проверяет его у Google и,
# если серверный мёртв, заменяет — без единого действия человека. Заодно стирает
# устаревший gemini-worker.url, чтобы сайт не тыкался в недоступный мост.

name: Gemini key health

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-bridge.yml'

concurrency:
  group: gemini-key-health
  cancel-in-progress: true

jobs:
  heal-key:
    name: Heal gemini.key on Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Check and heal the key
        env:
          BRIDGE_KEY: ${{ secrets.GEMINI_API_KEY_BRIDGE }}
        run: |
          # Без set -e: SSH к Hostinger флейкует таймаутом, обрыв не должен
          # ронять шаг. Ошибки ловим руками.
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          check_key() {
            curl -s -o /dev/null -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1&key=$1"
          }
          ssh_retry() {
            for a in 1 2 3; do
              if $SSH "$1"; then return 0; fi
              echo "  SSH попытка $a не прошла, жду…" >&2; sleep 10
            done
            return 1
          }

          # Ключ Gemini бывает двух форматов: старый AIza… и новый AQ.…
          KEYRE='AIza[A-Za-z0-9_-]\{30,\}\|AQ\.[A-Za-z0-9_.-]\{30,\}'
          HOSTKEY=$($SSH "cat ~/domains/dispatch4you.com/gemini.key" 2>/dev/null | grep -o "$KEYRE" | head -1)

          HCODE="000"; [ -n "$HOSTKEY" ] && HCODE=$(check_key "$HOSTKEY")
          echo "ключ на сервере: HTTP $HCODE"
          if [ "$HCODE" = "200" ]; then
            echo "серверный ключ рабочий — ничего не трогаю"
          elif [ -n "$BRIDGE_KEY" ] && [ "$(check_key "$BRIDGE_KEY")" = "200" ]; then
            if printf '%s' "$BRIDGE_KEY" | ssh_retry "cat > ~/domains/dispatch4you.com/gemini.key"; then
              echo "серверный ключ был мёртв — заменён рабочим из секрета"
            else
              echo "SSH недоступен — не заменил (перезапуск воркфлоу починит)"
            fi
          else
            echo "рабочего ключа нет ни на сервере, ни в секрете GEMINI_API_KEY_BRIDGE"
            echo "положить новый: gh secret set GEMINI_API_KEY_BRIDGE — дальше воркфлоу сам"
          fi

          # Мост недоступен на бесплатном тарифе — стираем его адрес, чтобы сайт
          # не пробовал недоступную точку и шёл рабочим путём PHP+Gemini.
          ssh_retry "rm -f ~/domains/dispatch4you.com/gemini-worker.url" || true
