# Мост Gemini Live — вебсокет для живого разговора на сайте.
#
# PHP на Hostinger вебсокет держать не умеет, поэтому мост живёт на Cloudflare
# Worker. Аккаунта Cloudflare нет и не нужно: wrangler deploy --temporary
# разворачивает на временный аккаунт без логина. Временный — значит смертный,
# поэтому мост пересоздаётся по расписанию каждую ночь, а свежий адрес
# записывается на Hostinger в gemini-worker.url. Умер среди дня — сайт сам
# откатывается на пайплайн, ночью мост воскресает.
#
# Ключ Gemini не хранится в GitHub: CI читает его по SSH с Hostinger, где он
# уже лежит (gemini.key рядом с groq.key).

name: Gemini Live bridge

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'broker-call/worker/**'
      - '.github/workflows/live-bridge.yml'

concurrency:
  group: live-bridge
  cancel-in-progress: true

jobs:
  deploy-bridge:
    name: Deploy websocket bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy bridge and publish its URL
        env:
          BRIDGE_KEY: ${{ secrets.GEMINI_API_KEY_BRIDGE }}
        run: |
          set -e
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"

          check_key() {
            curl -s -o /dev/null -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models?pageSize=1&key=$1"
          }

          # Кандидаты по порядку: секрет GitHub, затем ключ с Hostinger.
          # Ключ с Hostinger привязан к серверу — Google принимает его только
          # оттуда (проверено: с раннера 400 API key not valid, с Hostinger
          # работает). Мост живёт на Cloudflare, ему нужен свободный ключ.
          # По SSH вместе с файлом может приехать баннер хостинга, поэтому ключ
          # выделяется по формату AIza.
          HOSTKEY=$($SSH "cat ~/domains/dispatch4you.com/gemini.key" 2>/dev/null | grep -o 'AIza[A-Za-z0-9_-]\{30,\}' | head -1)
          KEY=""
          for CAND in "$BRIDGE_KEY" "$HOSTKEY"; do
            [ -z "$CAND" ] && continue
            CODE=$(check_key "$CAND")
            echo "ключ (префикс ${CAND:0:6}, ${#CAND} симв.): models.list HTTP $CODE"
            if [ "$CODE" = "200" ]; then KEY="$CAND"; break; fi
          done
          if [ -z "$KEY" ]; then
            echo "рабочего ключа для моста нет — сайт остаётся на пайплайне"
            echo "новый ключ кладётся ОДНИМ действием: gh secret set GEMINI_API_KEY_BRIDGE — дальше всё само"
            exit 0
          fi

          # Самолечение: если ключ на Hostinger мёртв (утёкший отзывают в
          # минуты), а рабочий есть — обновляем gemini.key на сервере. Тогда
          # озвучка и разбор на самом сайте оживают без человека.
          if [ "$KEY" != "$HOSTKEY" ]; then
            HCODE="000"
            [ -n "$HOSTKEY" ] && HCODE=$(check_key "$HOSTKEY")
            if [ "$HCODE" != "200" ]; then
              $SSH "printf '%s' '$KEY' > ~/domains/dispatch4you.com/gemini.key"
              echo "gemini.key на Hostinger был мёртв (HTTP $HCODE) — заменён рабочим"
            fi
          fi

          cd broker-call/worker
          # Ключ уезжает переменной внутрь деплоя: секреты на временный аккаунт
          # не кладутся (нет авторизации), а наружу ключ не виден.
          printf '\n[vars]\nGEMINI_API_KEY = "%s"\n' "$KEY" >> wrangler.toml
          OUT=$(npx wrangler deploy --temporary 2>&1) || { echo "деплой не прошёл:"; echo "$OUT" | grep -v -i "claim\|token" | tail -6; exit 0; }
          URL=$(echo "$OUT" | grep -o 'https://[a-z0-9.-]*workers\.dev' | head -1)
          if [ -z "$URL" ]; then echo "адрес воркера в выводе не найден"; exit 0; fi

          # Мост проверяется тем же путём, каким пойдёт звонок: выдача сессии.
          # С повторами: свежий адрес workers.dev расползается по DNS не сразу,
          # и первая проверка через две секунды после деплоя била в пустоту.
          OK=""
          for i in 1 2 3 4 5 6 7 8; do
            RESP=$(curl -s --max-time 20 -X POST "$URL/api/gemini-session" -H 'Content-Type: application/json' -H 'Origin: https://dispatch4you.com' -d '{"seed":"call-001"}' || true)
            if echo "$RESP" | grep -q '"token"'; then OK=yes; break; fi
            echo "попытка $i: $(echo "$RESP" | sed 's/"token":"[^"]*"/"token":"<скрыт>"/' | head -c 160)"
            sleep 8
          done
          if [ -z "$OK" ]; then
            echo "мост поднялся, но сессию не выдаёт — адрес на сайт не публикуем"
            exit 0
          fi

          $SSH "printf '%s' '$URL' > ~/domains/dispatch4you.com/gemini-worker.url"
          echo "мост живой и опубликован: $URL"
