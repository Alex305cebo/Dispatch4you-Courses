name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  # ─── Определяем что изменилось ────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      game: ${{ steps.filter.outputs.game }}
      maptrainer: ${{ steps.filter.outputs.maptrainer }}
      academy: ${{ steps.filter.outputs.academy }}
      brokercall: ${{ steps.filter.outputs.brokercall }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - '*.html'
              - '*.css'
              - '*.js'
              - '*.xml'
              - 'sitemap.xml'
              - 'robots.txt'
              - 'ext/**'
              - 'api/**'
              - 'pages/**'
              - 'js/**'
              - 'css/**'
              - 'assets/**'
              - 'audio/**'
              - 'audio-transcripts/**'
              - 'shared-styles.css'
              - 'dark-theme.css'
              - 'dark-mode.js'
              - 'auth.js'
              - 'auth-check.js'
              - 'access-control.js'
              - '.htaccess'
              - 'Card/**'
              - '__/**'
            brokercall:
              - 'broker-call/src/**'
              - 'broker-call/scripts/**'
              - 'broker-call/server/**'
              - 'broker-call/index.html'
              - 'broker-call/vite.config.ts'
              - 'broker-call/package.json'
              # Смена зависимостей обязана пересобирать: npm ci ставит ровно то,
              # что записано здесь.
              - 'broker-call/package-lock.json'
            game:
              - 'adventure/**'
            academy:
              - 'games/dispatch-academy-app/src/**'
              - 'games/dispatch-academy-app/public/**'
              - 'games/dispatch-academy-app/index.html'
              - 'games/dispatch-academy-app/vite.config.ts'
              - 'games/dispatch-academy-app/package.json'
            maptrainer:
              - 'map-trainer/src/**'
              - 'map-trainer/public/**'
              - 'map-trainer/level-cards/**'
              - 'map-trainer/index.html'
              - 'map-trainer/vite.config.js'
              - 'map-trainer/package.json'

  # ─── 1. Статический сайт — только если изменились его файлы ───────
  deploy-site:
    name: Deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via rsync (with retry)
        run: |
          # Что и почему исключено сверх прежнего списка (проверено запросами
          # к боевому сайту, ни на что из этого страницы не ссылаются):
          #   ffmpeg-8.1        — 10086 файлов чужих исходников, попавших в репо
          #                       заодно; /ffmpeg-8.1/configure отдавался как
          #                       300 КБ по прямой ссылке
          #   _archive          — прошлые версии страниц; /_archive/backups/
          #                       index.OLD.html отдавал 385 КБ старой главной
          #   *-showcase/demo   — страницы-образцы вёрстки, ссылок на них нет
          #   build_*/fetch_*/  — скрипты сборки данных карты, запускаются руками
          #   check_*/states_*    на машине и браузеру не нужны
          #   TRUCKPIC13        — картинки, не используемые ни одной страницей
          #   .cursorrules и    — служебные файлы разработки, зря показывают
          #   .env.example        устройство проекта
          # НЕ исключать: __/auth — это обработчик входа Firebase, домен входа
          # authDomain="dispatch4you.com", без него ломается вход через Google.
          for i in 1 2 3 4; do
            echo "Deploy attempt $i..."
            rsync -avzrc --delete \
              --exclude='.git' --exclude='.github' --exclude='.kiro' \
              --exclude='.claude' \
              --exclude='*.bat' --exclude='*.sh' \
              --exclude='adventure' --exclude='game' --exclude='games' --exclude='map-trainer/' \
              --exclude='dispatch-academy-app' --exclude='game2' \
              --exclude='broker-call' \
              --exclude='node_modules' --exclude='*.md' --exclude='*.backup' \
              --exclude='*.bak' --exclude='*.old' --exclude='*.albers-backup' \
              --exclude='*.fixed-projection' --exclude='*.v2-debug' \
              --exclude='Old Modules' --exclude='server.py' \
              --exclude='installer' --exclude='build' \
              --exclude='DispatchPro extension' \
              --exclude='package.json' --exclude='package-lock.json' \
              --exclude='*.py' --exclude='*.ps1' --exclude='states_extracted.txt' \
              --exclude='MAP_DEBUG_INSTRUCTIONS.html' --exclude='game-test.html' \
              --exclude='test-*.html' \
              --exclude='ffmpeg-8.1' \
              --exclude='_archive' \
              --exclude='buttons-showcase.html' --exclude='card-variants.html' \
              --exclude='close-buttons-demo.html' --exclude='tutorial-demo.html' \
              --exclude='build_map.js' --exclude='build_final.js' \
              --exclude='download_states.js' --exclude='extract_states.js' \
              --exclude='fetch_cities.js' --exclude='fetch_cities_osm.js' \
              --exclude='fetch_routes_osrm.js' --exclude='generate-favicon-ico.js' \
              --exclude='check_outliers.js' --exclude='check_roads.js' \
              --exclude='check_snap.js' --exclude='check-favicon-final.js' \
              --exclude='states_clean.js' --exclude='states_new.js' \
              --exclude='states_publicamundi.js' --exclude='us-map-data.js' \
              --exclude='game-cities-data.js' --exclude='game-routes-data.js' \
              --exclude='game-weather.js' --exclude='game2-features.js' \
              --exclude='truck_detail_new.js' --exclude='cases-database.js' \
              --exclude='simul-dialogs-database.js' --exclude='aiService.ts' \
              --exclude='TRUCKPIC13' \
              --exclude='.cursorrules' --exclude='.easignore' --exclude='.env.example' \
              -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key" \
              ./ \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/domains/dispatch4you.com/public_html/ \
              && echo "✅ Deploy successful" && exit 0
            echo "⚠️ Attempt $i failed, waiting $((i * 20))s..."
            sleep $((i * 10))
          done
          echo "❌ Deploy failed after 4 attempts"
          exit 1

      # Разовая уборка того, что раньше выкладывалось по ошибке.
      #
      # Почему отдельным шагом, а не через rsync: файл, попавший в --exclude,
      # для --delete неприкосновенен — rsync считает, что этой части приёмника
      # он не касается, и оставляет её как есть. Флаг --delete-excluded снял бы
      # эту защиту, но заодно снёс бы /game/, /games/, /map-trainer/ и
      # /broker-call/: они исключены здесь и приезжают отдельными задачами ниже.
      #
      # Поэтому — точный список путей, без единой маски. Каждый проверен на
      # отсутствие ссылок со страниц сайта.
      - name: Убрать с сервера то, что публиковалось по ошибке
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
              -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              'cd ~/domains/dispatch4you.com/public_html && \
               rm -rf ./ffmpeg-8.1 ./_archive ./TRUCKPIC13 && \
               rm -f ./buttons-showcase.html ./card-variants.html \
                     ./close-buttons-demo.html ./tutorial-demo.html \
                     ./build_map.js ./build_final.js ./download_states.js \
                     ./extract_states.js ./fetch_cities.js ./fetch_cities_osm.js \
                     ./fetch_routes_osrm.js ./generate-favicon-ico.js \
                     ./check_outliers.js ./check_roads.js ./check_snap.js \
                     ./check-favicon-final.js ./states_clean.js ./states_new.js \
                     ./states_publicamundi.js ./us-map-data.js \
                     ./game-cities-data.js ./game-routes-data.js \
                     ./game-weather.js ./game2-features.js ./truck_detail_new.js \
                     ./cases-database.js ./simul-dialogs-database.js \
                     ./aiService.ts ./.cursorrules ./.easignore ./.env.example && \
               echo "убрано"' || echo "⚠️ уборка не удалась — не повод валить деплой"
        continue-on-error: true

  # ─── 2. React/Expo (game1.html) → /game/ — только если изменился adventure/ ──
  deploy-react-game:
    name: Build & deploy React game (game1)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.game == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: adventure/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: adventure

      - name: Build
        run: npx expo export --platform web
        working-directory: adventure
        env:
          NODE_ENV: production

      - name: Fix asset paths
        run: node scripts/fix-paths.js
        working-directory: adventure

      - name: Copy emoji assets to dist
        run: |
          mkdir -p adventure/dist/assets/emojis
          cp adventure/public/assets/emojis/*.webp adventure/dist/assets/emojis/

      - name: Copy truck images to dist
        run: |
          mkdir -p adventure/dist/assets/TruckPic
          mkdir -p adventure/dist/game/assets/TruckPic
          cp adventure/TruckPic/*.png adventure/dist/assets/TruckPic/
          cp adventure/TruckPic/*.webp adventure/dist/assets/TruckPic/
          cp adventure/TruckPic/*.png adventure/dist/game/assets/TruckPic/
          cp adventure/TruckPic/*.webp adventure/dist/game/assets/TruckPic/

      - name: Copy video assets to dist
        run: |
          mkdir -p adventure/dist/assets
          mkdir -p adventure/dist/game
          cp adventure/public/Truck_loop.mp4 adventure/dist/ || true
          cp adventure/public/assets/Truck_loop.mp4 adventure/dist/assets/ || true
          cp adventure/public/game/Truck_loop.mp4 adventure/dist/game/ || true

      - name: Generate D4Y favicon
        run: node scripts/gen-favicon-ico.js
        working-directory: adventure

      - name: Add .htaccess for SPA routing
        run: |
          cat > adventure/dist/.htaccess << 'EOF'
          Options -MultiViews
          RewriteEngine On
          RewriteBase /game/
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to /game/ (with retry)
        run: |
          for i in 1 2 3 4; do
            echo "Deploy attempt $i..."
            rsync -avzrc --delete \
              -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key" \
              adventure/dist/ \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/domains/dispatch4you.com/public_html/game/ \
              && echo "✅ Deploy successful" && exit 0
            echo "⚠️ Attempt $i failed, waiting $((i * 20))s..."
            sleep $((i * 10))
          done
          echo "❌ Deploy failed after 4 attempts"
          exit 1

  # ─── 3. Map Trainer (React/Vite) → /map-trainer/ ──────────────────
  deploy-map-trainer:
    name: Build & deploy React game (map-trainer)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.maptrainer == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: map-trainer

      - name: Build
        run: npm run build
        working-directory: map-trainer
        env:
          NODE_ENV: production

      - name: Add .htaccess for map-trainer
        run: |
          cat > map-trainer/dist/.htaccess << 'EOF'
          # COOP заголовок — разрешает popup для Firebase Auth
          <IfModule mod_headers.c>
            Header always set Cross-Origin-Opener-Policy "unsafe-none"
            Header always set Cross-Origin-Embedder-Policy "unsafe-none"
          </IfModule>

          # SPA routing — все пути ведут на index.html
          Options -MultiViews
          RewriteEngine On
          RewriteBase /map-trainer/
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
          EOF

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          for i in 1 2 3 4; do
            echo "Attempt $i: testing SSH to ${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }}..."
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo OK" 2>/dev/null; then
              echo "✅ SSH connection successful"
              exit 0
            fi
            echo "⚠️ Attempt $i failed, waiting $((i * 15))s..."
            sleep $((i * 15))
          done
          echo "❌ SSH connection failed after 4 attempts"
          exit 1

      - name: Deploy to /map-trainer/ (with retry)
        run: |
          for i in 1 2 3 4; do
            echo "Deploy attempt $i..."
            rsync -avzrc --delete --exclude='level-cards' \
              -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key" \
              map-trainer/dist/ \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/domains/dispatch4you.com/public_html/map-trainer/ \
              && echo "✅ Deploy successful" && exit 0
            echo "⚠️ Attempt $i failed, waiting $((i * 20))s..."
            sleep $((i * 10))
          done
          echo "❌ Deploy failed after 4 attempts"
          exit 1

      - name: Deploy level-cards images (with retry)
        run: |
          for i in 1 2 3 4; do
            rsync -avzrc \
              -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key" \
              map-trainer/level-cards/ \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/domains/dispatch4you.com/public_html/map-trainer/level-cards/ \
              && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: Verify critical files are accessible
        run: |
          echo "Checking states-10m.json..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://dispatch4you.com/map-trainer/states-10m.json)
          if [ "$STATUS" != "200" ]; then
            echo "❌ CRITICAL: states-10m.json returned HTTP $STATUS — map will not render!"
            exit 1
          fi
          echo "✅ states-10m.json OK (HTTP $STATUS)"

  # ─── 4. Dispatch Academy (React/Vite) → /games/dispatch-academy-app/ ────
  deploy-academy:
    name: Build & deploy Dispatch Academy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.academy == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: games/dispatch-academy-app

      - name: Build
        run: npx vite build
        working-directory: games/dispatch-academy-app
        env:
          NODE_ENV: production

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to /games/dispatch-academy-app/ (with retry)
        run: |
          for i in 1 2 3 4; do
            echo "Deploy attempt $i..."
            rsync -avzrc --delete \
              -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key" \
              games/dispatch-academy-app/dist/ \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/domains/dispatch4you.com/public_html/games/dispatch-academy-app/ \
              && echo "✅ Deploy successful" && exit 0
            echo "⚠️ Attempt $i failed, waiting $((i * 20))s..."
            sleep $((i * 10))
          done
          echo "❌ Deploy failed after 4 attempts"
          exit 1

  # ─── 5. Broker Call (React/Vite) → /broker-call/ ───────────────────
  # Серверную часть (api/broker-call.php и сгенерированный
  # api/broker-config.php) выкладывает job статического сайта — они лежат
  # в api/ и попадают туда обычным путём.
  deploy-broker-call:
    name: Build & deploy Broker Call
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.brokercall == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: broker-call

      - name: Test
        run: npm test
        working-directory: broker-call

      - name: Build
        run: npm run build
        working-directory: broker-call
        env:
          NODE_ENV: production

      # Промпт брокера и схемы инструментов обязаны остаться на сервере.
      # Если они утекли в бандл — деплой останавливается, а не выкладывает.
      - name: Verify no secrets in bundle
        working-directory: broker-call
        run: |
          if grep -rq "You are a person on a phone call" dist/assets/; then
            echo "❌ Системный промпт попал в бандл"; exit 1
          fi
          if grep -rq "Run the carrier MC number through" dist/assets/; then
            echo "❌ Схемы инструментов попали в бандл"; exit 1
          fi
          if grep -rqE "gsk_[A-Za-z0-9]|csk-[A-Za-z0-9]|sk-proj-" dist/assets/; then
            echo "❌ В бандле похоже на ключ API"; exit 1
          fi
          echo "✅ Ни промпта, ни ключей в бандле нет"

      # Сборка перегенерировала api/broker-config.php. Если он отличается от
      # закоммиченного, значит промпт или схемы правили, а конфиг не собрали
      # заново — и на сервер уехала бы новая программа со старым промптом.
      # Разошлись бы они молча: фронт работает, брокер ведёт себя по-старому.
      - name: Verify generated server config is committed
        run: |
          if ! git diff --quiet -- api/broker-config.php; then
            echo "❌ api/broker-config.php не совпадает со сборкой."
            echo "   Пересоберите и закоммитьте:"
            echo "   cd broker-call && npm run build:server-config"
            git diff --stat -- api/broker-config.php
            exit 1
          fi
          echo "✅ Серверный конфиг совпадает с исходниками"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to /broker-call/ (with retry)
        run: |
          for i in 1 2 3 4; do
            echo "Deploy attempt $i..."
            rsync -avzrc --delete \
              -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key" \
              broker-call/dist/ \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/domains/dispatch4you.com/public_html/broker-call/ \
              && echo "✅ Deploy successful" && exit 0
            echo "⚠️ Attempt $i failed, waiting $((i * 20))s..."
            sleep $((i * 10))
          done
          echo "❌ Deploy failed after 4 attempts"
          exit 1

      - name: Verify live
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://dispatch4you.com/broker-call/)
          echo "broker-call status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "❌ /broker-call/ вернул HTTP $STATUS"; exit 1
          fi
