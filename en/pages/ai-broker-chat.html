<!DOCTYPE html>
<html lang="en" style="background:var(--surface-base)">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/site-protection.js"></script>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark light">
  <!-- Тема: выставляем ДО первой отрисовки, иначе моргнёт чужая. -->
  <script>/*d4y-theme-boot*/(function(){try{var s=localStorage.getItem('d4y-theme');var a=(localStorage.getItem('user_role')||'').toLowerCase()==='superuser';document.documentElement.setAttribute('data-theme',(s==='light'&&a)?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
  <link rel="stylesheet" href="/css/tokens.css?v=38">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Permissions-Policy" content="microphone=(self)">
  <script type="module" src="/firebase-auth-init.js?v=4.0"></script>
  <script src="/role-guard.js"></script>
  <title>📞 Broker Call — voice trainer | Dispatcher Courses</title>
  <meta name="description" content="Voice trainer: you call a freight broker, give your MC, negotiate the rate and book the load. A live conversation in English with a debrief after the call.">
  <link rel="canonical" href="https://dispatch4you.com/en/pages/ai-broker-chat.html">
  <link rel="alternate" hreflang="ru" href="https://dispatch4you.com/pages/ai-broker-chat.html">
  <link rel="alternate" hreflang="en" href="https://dispatch4you.com/en/pages/ai-broker-chat.html">
  <link rel="stylesheet" href="/shared-nav.css?v=9.1">
  <style>
    /* Страница — оболочка: шапка сайта и гейт по роли здесь, сам тренажёр —
       React-приложение /broker-call/ во фрейме на весь остаток экрана.
       Прежняя версия (4000 строк на странице, Whisper + браузерный голос)
       заменена целиком; ссылки на этот адрес по сайту остались рабочими. */
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--surface-base, #050a12); }
    /* Фрейм прибит к экрану под меню. Раскладка через flex не работала:
       nav-loader ставит body padding-top под фиксированное меню и вставляет
       в body футер на 578px — фрейму оставалось 13px. Отступ сверху берётся
       из того же padding-top, что выставило меню (см. скрипт ниже). */
    #trainer { position: fixed; top: var(--nav-h, 64px); left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - var(--nav-h, 64px)); border: 0; display: block; background: #0b0d10; }
    #site-footer-injected { display: none !important; }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <iframe id="trainer" src="/broker-call/?lang=en" title="Broker Call" allow="microphone; autoplay" allowfullscreen></iframe>

  <script src="/nav-loader.js?v=28"></script>
  <script>
  // Высота меню = padding-top, который nav-loader выставляет body. Меню
  // подгружается асинхронно, поэтому перечитываем несколько раз и на resize.
  (function () {
    function fit() {
      var pt = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
      document.documentElement.style.setProperty('--nav-h', pt + 'px');
    }
    fit(); setTimeout(fit, 300); setTimeout(fit, 1500); setTimeout(fit, 4000);
    window.addEventListener('resize', fit);
  })();
  </script>
  <script>
  // XP за звонок приходит из тренажёра сообщением — сам он про xp-system не знает.
  (function () {
    var PAGE_KEY = 'xp_page_pages_ai_broker_chat_html';
    var xp = null;
    function system() { return xp || (xp = import('/xp-system.js').catch(function () { return null; })); }

    if (!localStorage.getItem(PAGE_KEY)) {
      system().then(function (m) {
        return m && m.awardXP('AI_BROKER_USED');
      }).then(function (r) { if (r) localStorage.setItem(PAGE_KEY, '1'); }).catch(function () {});
    }

    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin) return;
      var d = e.data;
      if (!d || d.type !== 'broker-call:done') return;
      var score = Number(d.score) || 0;
      system().then(function (m) {
        if (!m) return;
        m.awardXP('BROKER_SESSION_COMPLETE', { score: score, ended: d.ended });
        if (score >= 9) m.awardXP('BROKER_PERFECT_SCORE', { score: score });
        else if (score >= 8) m.awardXP('BROKER_HIGH_SCORE', { score: score });
      }).catch(function () {});
    });
  })();
  </script>
</body>
</html>
